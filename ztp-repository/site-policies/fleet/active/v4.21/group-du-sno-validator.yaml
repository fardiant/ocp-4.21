---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: du-sno-validator
placementBindingDefaults:
  name: group-du-sno-placement-binding
policyDefaults:
  namespace: ztp-policies
  placement:
    labelSelector:
      matchExpressions:
      - key: group-du-sno
        operator: Exists
      - key: logicalGroup
        operator: In
        values: ["active"]
      - key: ztp-done
        operator: DoesNotExist
  remediationAction: inform
  severity: low
  namespaceSelector:
    exclude:
      - kube-*
    include:
      - '*'
  evaluationInterval:
   # This low setting is only valid if the validation policy is disconnected from the cluster at steady-state
   # using a bindingExcludeRules entry with ztp-done
    compliant: 5s
    noncompliant: 10s
policies:
- name: group-du-sno-validator
  policyAnnotations:
    ran.openshift.io/soak-seconds: "30"
    ran.openshift.io/ztp-deploy-wave: "10000"
  manifests:
    - path: source-crs/reference-crs/validatorCRs/informDuValidatorMaster.yaml
