---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: du-sno
placementBindingDefaults:
  name: group-du-sno-placement-binding
policyDefaults:
  namespace: ztp-policies
  placement:
    labelSelector:
      group-du-sno: ""
      logicalGroup: "active"
      hardware-type: "hw-type-platform-1"
  remediationAction: inform
  severity: low
  # standards: []
  namespaceSelector:
    exclude:
      - kube-*
    include:
      - '*'
  evaluationInterval:
    compliant: 10m
    noncompliant: 10s
policies:
- name: du-sno-group-policy
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "10"
  manifests:
    - path: source-crs/reference-crs/ClusterLogServiceAccount.yaml
    - path: source-crs/reference-crs/ClusterLogServiceAccountAuditBinding.yaml
    - path: source-crs/reference-crs/ClusterLogServiceAccountInfrastructureBinding.yaml
    - path: source-crs/reference-crs/ClusterLogForwarder.yaml
      patches:
      - spec:
          filters:
          - name: ran-du-labels
            type: openshiftLabels
            openshiftLabels:
              cluster-type: "du-sno"
          serviceAccount:
            name: collector
          outputs:
          - name: loki-hub
            type: "loki"
            loki:
              url: https://logging-loki-openshift-logging.apps.hub.5g-deployment.lab/api/logs/v1/tenant-snos
              labelKeys:
              - log_type
              - kubernetes.namespace_name
              - kubernetes.pod_name
              - openshift.cluster_id
            tls:
              insecureSkipVerify: true
              ca:
                key: ca-bundle.crt
                secretName: mtls-tenant-snos
              certificate:
                key: tls.crt
                secretName: mtls-tenant-snos
              key:
                key: tls.key
                secretName: mtls-tenant-snos
          pipelines:
          - name: sno-logs
            inputRefs:
            - infrastructure
            - audit
            outputRefs:
            - loki-hub
            filterRefs:
            - ran-du-labels
    - path: source-crs/custom-crs/logging-mtls-secret.yaml
    - path: source-crs/reference-crs/PtpConfigSlave.yaml
      patches:
      - spec:
          profile:
          - interface: enp4s0
            name: slave
            ptp4lOpts: "-2 -s -A --clientOnly=1 --step_threshold=0.1"
            # ptp4lOpts  -A --clientOnly=1 --step_threshold=0.1 are required for this
            # lab environment running on virtual hardware
            # phc2sysOpts should have -a, and instead we have to specify clock device manually (-s)
            phc2sysOpts: -r -n 24 -s /dev/ptp0
            ptp4lConf: |
              [global]
              #
              # Default Data Set
              #
              twoStepFlag 1
              slaveOnly 1
              priority1 128
              priority2 128
              domainNumber 24
              #utc_offset 37
              clockClass 255
              clockAccuracy 0xFE
              offsetScaledLogVariance 0xFFFF
              free_running 0
              freq_est_interval 1
              dscp_event 0
              dscp_general 0
              dataset_comparison G.8275.x
              G.8275.defaultDS.localPriority 128
              #
              # Port Data Set
              #
              logAnnounceInterval -3
              logSyncInterval -4
              logMinDelayReqInterval -4
              logMinPdelayReqInterval -4
              announceReceiptTimeout 3
              syncReceiptTimeout 0
              delayAsymmetry 0
              fault_reset_interval -4
              neighborPropDelayThresh 20000000
              masterOnly 0
              G.8275.portDS.localPriority 128
              #
              # Run time options
              #
              assume_two_step 0
              logging_level 6
              path_trace_enabled 0
              follow_up_info 0
              hybrid_e2e 0
              inhibit_multicast_service 0
              net_sync_monitor 0
              tc_spanning_tree 0
              tx_timestamp_timeout 50
              unicast_listen 0
              unicast_master_table 0
              unicast_req_duration 3600
              use_syslog 1
              verbose 0
              summary_interval 0
              kernel_leap 1
              check_fup_sync 0
              #clock_class_threshold 7 -> we use threshold 248 since GM doesn't have a GPS source
              clock_class_threshold 248
              #
              # Servo Options
              #
              pi_proportional_const 0.0
              pi_integral_const 0.0
              pi_proportional_scale 0.0
              pi_proportional_exponent -0.3
              pi_proportional_norm_max 0.7
              pi_integral_scale 0.0
              pi_integral_exponent 0.4
              pi_integral_norm_max 0.3
              step_threshold 2.0
              first_step_threshold 0.00002
              max_frequency 900000000
              clock_servo pi
              sanity_freq_limit 200000000
              ntpshm_segment 0
              #
              # Transport options
              #
              transportSpecific 0x0
              ptp_dst_mac 01:1B:19:00:00:00
              p2p_dst_mac 01:80:C2:00:00:0E
              udp_ttl 1
              udp6_scope 0x0E
              uds_address /var/run/ptp4l
              #
              # Default interface options
              #
              clock_type OC
              network_transport L2
              delay_mechanism E2E
              time_stamping software
              tsproc_mode filter
              delay_filter moving_median
              delay_filter_length 10
              egressLatency 0
              ingressLatency 0
              boundary_clock_jbod 0
              #
              # Clock description
              #
              productDescription ;;
              revisionData ;;
              manufacturerIdentity 00:00:00
              userDescription ;
              timeSource 0xA0
            ptpSchedulingPolicy: SCHED_FIFO
            ptpSchedulingPriority: 10
            ptpSettings:
              logReduce: "true"
          recommend:
          - match:
            - nodeLabel: node-role.kubernetes.io/master
            priority: 4
            profile: slave
    - path: source-crs/reference-crs/DisableOLMPprof.yaml
    - path: source-crs/reference-crs/DisableSnoNetworkDiag.yaml
    - path: source-crs/reference-crs/ConsoleOperatorDisable.yaml
    - path: source-crs/reference-crs/SriovOperatorConfig-SetSelector.yaml
      patches:
      - spec:
          disableDrain: true
          enableOperatorWebhook: '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-supported-sriov-nic" (index .ManagedClusterLabels "hardware-type")) | toBool hub}}'
    - path: source-crs/reference-crs/StorageLVMCluster.yaml
      patches:
      - spec:
          storage:
            deviceClasses:
              - name: vg1
                thinPoolConfig:
                  name: thin-pool-1
                  sizePercent: 90
                  overprovisionRatio: 10
                deviceSelector:
                  paths:
                  - '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-storage-path" (index .ManagedClusterLabels "hardware-type")) hub}}'
    - path: source-crs/reference-crs/PerformanceProfile-SetSelector.yaml
      patches:
      - spec:
          cpu:
            isolated: '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-cpu-isolated" (index .ManagedClusterLabels "hardware-type")) hub}}'
            reserved: '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-cpu-reserved" (index .ManagedClusterLabels "hardware-type")) hub}}'
          hugepages:
            defaultHugepagesSize: '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-hugepages-default" (index .ManagedClusterLabels "hardware-type"))| hub}}'
            pages:
            - count: '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-hugepages-count" (index .ManagedClusterLabels "hardware-type")) | toInt hub}}'
              size: '{{hub fromConfigMap "" "group-hardware-types-configmap" (printf "%s-hugepages-size" (index .ManagedClusterLabels "hardware-type")) hub}}'
          numa:
            topologyPolicy: restricted
          realTimeKernel:
            enabled: false
          # WorkloadHints defines the set of upper level flags for different type of workloads.
          # The configuration below is set for a low latency, performance mode.
          workloadHints:
            realTime: true
            highPowerConsumption: false
            perPodPowerManagement: false
          machineConfigPoolSelector:
            pools.operator.machineconfiguration.openshift.io/master: ""
          nodeSelector:
            node-role.kubernetes.io/master: ''
    - path: source-crs/reference-crs/TunedPerformancePatch.yaml
      patches:
      - spec:
          profile:
            - name: performance-patch
              data: |
                [main]
                summary=Configuration changes profile inherited from performance created tuned
                include=openshift-node-performance-openshift-node-performance-profile
                [sysctl]
                # When using the standard (non-realtime) kernel, remove the kernel.timer_migration override from the [sysctl] section
                # kernel.timer_migration=0
                [scheduler]
                group.ice-ptp=0:f:10:*:ice-ptp.*
                group.ice-gnss=0:f:10:*:ice-gnss.*
                group.ice-dplls=0:f:10:*:ice-dplls.*
                [service]
                service.stalld=start,enable
                service.chronyd=stop,disable
          recommend:
            - machineConfigLabels:
                machineconfiguration.openshift.io/role: master
              priority: 19
              profile: performance-patch
